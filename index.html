<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TallerLog — Carrocería FP</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1114;--surface:#1a1e24;--surface2:#222831;--border:#2e343d;--accent:#f97316;--accent2:#fbbf24;--text:#e8eaed;--text-dim:#8a9099;--success:#22c55e;--danger:#ef4444;--radius:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;overflow-x:hidden;}
header{background:var(--surface);border-bottom:2px solid var(--accent);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--accent);letter-spacing:-0.5px;text-transform:uppercase;}
.nav-tabs{display:flex;background:var(--surface2);padding:4px;gap:4px;margin:15px;border-radius:var(--radius);border:1px solid var(--border);}
.nav-tab{flex:1;padding:10px;text-align:center;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--text-dim);transition:0.2s;}
.nav-tab.active{background:var(--accent);color:white;}
.section{display:none;padding:0 15px 100px;}
.section.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:15px;}
.field-label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.5px;}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:white;padding:12px;border-radius:6px;font-family:inherit;font-size:15px;margin-bottom:15px;}
.btn{width:100%;padding:14px;border-radius:6px;border:none;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:0.2s;}
.btn-primary{background:var(--accent);color:white;}
.btn-success{background:var(--success);color:white;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.step-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:10px;margin-bottom:20px;}
.step-item{background:var(--surface2);border:1px solid var(--border);padding:15px;border-radius:var(--radius);text-align:center;cursor:pointer;transition:0.2s;}
.step-item.active{border-color:var(--accent);background:rgba(249,115,22,0.1);color:var(--accent);}
.badge{padding:4px 8px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;}
.badge-pending{background:rgba(251,181,36,0.2);color:var(--accent2);}
</style>
</head>
<body>

<header>
  <div class="logo">TallerLog <span style="color:white;font-weight:400;font-size:14px;">GP</span></div>
</header>

<div class="nav-tabs">
  <div class="nav-tab active" onclick="showSection('form')">NUEVO</div>
  <div class="nav-tab" onclick="showSection('list')">HISTORIAL</div>
</div>

<div id="section-form" class="section active">
  <div class="card">
    <label class="field-label">Información General</label>
    <input type="text" id="alumnoName" placeholder="Nombre del Alumno">
    <input type="text" id="vehiculoName" placeholder="Vehículo / Matrícula">
    
    <label class="field-label">Fase del Proceso</label>
    <select id="faseProceso">
      <option value="Desabollado">Desabollado</option>
      <option value="Lijado/Preparación">Lijado/Preparación</option>
      <option value="Enmascarado">Enmascarado</option>
      <option value="Pintura">Pintura</option>
      <option value="Montaje Final">Montaje Final</option>
    </select>
  </div>

  <div class="card">
    <label class="field-label">Observaciones del Trabajo</label>
    <textarea id="observaciones" rows="3" placeholder="Detalla materiales usados, granos de lija, etc."></textarea>
  </div>

  <button class="btn btn-success" onclick="finalizeRegistro()">FINALIZAR Y ENVIAR AL EXCEL</button>
</div>

<div id="section-list" class="section">
  <div id="list-container"></div>
</div>

<script>
// --- 1. CONFIGURACIÓN DE TU GOOGLE SHEETS ---
const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbzjX7TB6WTm9OwOx35VrsrUF6JJijoIxT7JrWzy373khzAKsSF6ASnyDxGTG2JQ-X2E/exec";

// --- 2. FUNCIÓN DE ENVÍO ---
async function syncToCloud(registro) {
  try {
    await fetch(URL_GOOGLE_SHEETS, {
      method: 'POST',
      mode: 'no-cors', 
      cache: 'no-cache',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(registro)
    });
    console.log("Datos enviados correctamente.");
    return true;
  } catch (error) {
    console.error("Error al enviar:", error);
    return false;
  }
}

// --- 3. LÓGICA DE LA APP ---
let currentRegistro = {};

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
  if(id === 'list') renderList();
}

function finalizeRegistro() {
  const alumno = document.getElementById('alumnoName').value;
  const vehiculo = document.getElementById('vehiculoName').value;
  const fase = document.getElementById('faseProceso').value;
  const obs = document.getElementById('observaciones').value;

  if(!alumno || !vehiculo) {
    alert("Por favor, rellena nombre y vehículo.");
    return;
  }

  const registro = {
    fecha: new Date().toLocaleString(),
    alumnoName: alumno,
    vehiculoName: vehiculo,
    fase: fase,
    observaciones: obs,
    id: 'ID-' + Date.now()
  };

  // Guardar en el historial local del móvil
  const localData = JSON.parse(localStorage.getItem('taller_logs') || '[]');
  localData.push(registro);
  localStorage.setItem('taller_logs', JSON.stringify(localData));

  // ENVIAR AL EXCEL
  syncToCloud(registro);

  alert("¡Registro enviado al profesor!");
  
  // Limpiar formulario
  document.getElementById('alumnoName').value = "";
  document.getElementById('vehiculoName').value = "";
  document.getElementById('observaciones').value = "";
  showSection('list');
}

function renderList() {
  const container = document.getElementById('list-container');
  const data = JSON.parse(localStorage.getItem('taller_logs') || '[]');
  container.innerHTML = data.reverse().map(reg => `
    <div class="card">
      <div style="display:flex; justify:space-between; margin-bottom:10px;">
        <span style="font-weight:700; color:var(--accent);">${reg.vehiculoName}</span>
        <span style="font-size:12px; color:var(--text-dim);">${reg.fecha}</span>
      </div>
      <div style="font-size:14px; margin-bottom:5px;"><strong>Alumno:</strong> ${reg.alumnoName}</div>
      <div style="font-size:14px; margin-bottom:5px;"><strong>Fase:</strong> ${reg.fase}</div>
      <div style="font-size:13px; color:var(--text-dim); font-style:italic;">${reg.observaciones}</div>
    </div>
  `).join('');
}
</script>

</body>
</html>
