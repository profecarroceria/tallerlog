<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TallerLog v3.5 — Gestión por Pestañas</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1114; --surface: #1a1e24; --surface2: #222831;
            --border: #2e343d; --accent: #f97316; --text: #e8eaed;
            --text-dim: #8a9099; --success: #22c55e; --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
        
        header { background: var(--surface); padding: 15px 20px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; color: var(--accent); text-transform: uppercase; }
        
        .nav-tabs { display: flex; gap: 8px; padding: 12px; background: var(--bg); }
        .nav-tab { flex: 1; padding: 12px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font-weight: 600; cursor: pointer; transition: 0.3s; }
        .nav-tab.active { background: var(--accent); border-color: var(--accent); color: white; }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
        h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; margin-bottom: 15px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
        
        label { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        input, select, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: white; padding: 14px; border-radius: 8px; font-family: inherit; font-size: 16px; margin-bottom: 15px; }
        
        .grid-selection { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .item-select { background: var(--surface2); border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; cursor: pointer; }
        .item-select.selected { border-color: var(--accent); background: rgba(249, 115, 22, 0.15); color: var(--accent); font-weight: 600; }

        .btn { width: 100%; padding: 16px; border-radius: 8px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: var(--accent); color: white; }
        
        .log-item { background: var(--surface); border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 12px; border-radius: 0 var(--radius) var(--radius) 0; }
        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>
<body>

<header>
    <div class="logo">TallerLog <span style="color:white; font-size:14px; font-weight:400;">IES GP</span></div>
</header>

<div class="nav-tabs">
    <div class="nav-tab active" onclick="showSection('form')">REGISTRO</div>
    <div class="nav-tab" onclick="showSection('dash')">HISTORIAL</div>
</div>

<div class="container">
    <div id="section-form" class="section active">
        <div class="card">
            <h3>Alumno y Vehículo</h3>
            <label>Nombre del Alumno</label>
            <input type="text" id="alumnoName" placeholder="Escribe tu nombre">
            <label>Vehículo / Matrícula</label>
            <input type="text" id="vehiculoName" placeholder="Ej: Seat León - 1234ABC">
        </div>

        <div class="card">
            <h3>Operación Realizada</h3>
            <label>Fase</label>
            <select id="faseProceso">
                <option value="Desabollado">Desabollado / Carrocería</option>
                <option value="Lijado Masillas">Lijado Masillas</option>
                <option value="Aparejado">Aparejado</option>
                <option value="Enmascarado">Enmascarado</option>
                <option value="Pintura">Pintura</option>
                <option value="Montaje">Montaje</option>
            </select>

            <label>Piezas Tocadas</label>
            <div class="grid-selection" id="piezas-grid">
                <div class="item-select" onclick="this.classList.toggle('selected')">Aleta Del.</div>
                <div class="item-select" onclick="this.classList.toggle('selected')">Puerta</div>
                <div class="item-select" onclick="this.classList.toggle('selected')">Capó</div>
                <div class="item-select" onclick="this.classList.toggle('selected')">Techo</div>
                <div class="item-select" onclick="this.classList.toggle('selected')">Paragolpes</div>
                <div class="item-select" onclick="this.classList.toggle('selected')">Aleta Tras.</div>
            </div>
        </div>

        <div class="card">
            <h3>Detalles</h3>
            <textarea id="observaciones" rows="3" placeholder="Lijas usadas, tiempos, etc."></textarea>
            <button class="btn btn-primary" onclick="enviarDatos()">ENVIAR TRABAJO</button>
        </div>
    </div>

    <div id="section-dash" class="section">
        <div id="history-container"></div>
    </div>
</div>

<script>
// URL actualizada con la gestión automática de pestañas
const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbzfmw1wJ-XoAU4kyAaXS5xonAKCr4dUBQj_h1Y09OjgJA-0V9RcMDno6GnZV57vF_kh/exec";

async function enviarDatos() {
    const alumno = document.getElementById('alumnoName').value.trim();
    const vehiculo = document.getElementById('vehiculoName').value;
    const fase = document.getElementById('faseProceso').value;
    const obs = document.getElementById('observaciones').value;
    
    const piezas = [];
    document.querySelectorAll('.selected').forEach(el => piezas.push(el.innerText));

    if(!alumno || !vehiculo) {
        alert("Completa tu nombre y el vehículo");
        return;
    }

    const registro = {
        fecha: new Date().toLocaleString('es-ES'),
        alumnoName: alumno,
        vehiculoName: vehiculo,
        fase: fase,
        piezas: piezas.join(", "),
        observaciones: obs,
        id: 'ID-' + Date.now()
    };

    // Guardado local (historial en el móvil)
    const local = JSON.parse(localStorage.getItem('taller_v3_pestañas') || '[]');
    local.push(registro);
    localStorage.setItem('taller_v3_pestañas', JSON.stringify(local));

    // Envío al servidor de Google
    try {
        fetch(URL_GOOGLE_SHEETS, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(registro)
        });
        alert("¡Enviado! Tu profesor verá tu pestaña en el Excel.");
        resetForm();
    } catch(e) {
        alert("Error al enviar, pero se guardó en tu historial.");
    }
}

function resetForm() {
    document.getElementById('vehiculoName').value = "";
    document.getElementById('observaciones').value = "";
    document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
    showSection('dash');
}

function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('section-' + id).classList.add('active');
    event.currentTarget.classList.add('active');
    if(id === 'dash') renderHistory();
}

function renderHistory() {
    const container = document.getElementById('history-container');
    const data = JSON.parse(localStorage.getItem('taller_v3_pestañas') || '[]');
    container.innerHTML = data.reverse().map(reg => `
        <div class="log-item">
            <div style="font-weight:bold; color:var(--accent);">${reg.vehiculoName}</div>
            <div style="font-size:13px;">${reg.fase} - ${reg.piezas}</div>
            <div style="font-size:11px; color:var(--text-dim);">${reg.fecha}</div>
        </div>
    `).join('');
}
</script>
</body>
</html>
